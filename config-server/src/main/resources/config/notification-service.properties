spring.application.name=notification-service
server.port=${PORT}

# eureka config
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_DEFAULT_ZONE}

# spring config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# spring doc config
springdoc.api-docs.path=/${SERVICE_ORIGIN}/v3/api-docs
springdoc.swagger-ui.path=/${SERVICE_ORIGIN}/swagger-ui.html

# Zipkin Tracing Configuration
management.zipkin.tracing.endpoint=${ZIPKIN_TRACING_ENDPOINT}
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=ALWAYS
management.tracing.sampling.probability=1.0

# jwt
jwt_secret=${JWT_SECRET}

# kafka
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=notification:com.cpulsivek.notificationService.model.Notification
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=notification:com.cpulsivek.notificationService.dto.Notification
spring.kafka.consumer.group-id=uploadGroup
spring,json.trusted.packages=*